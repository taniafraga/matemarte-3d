<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatemArte — Galeria 3D Interativa</title>

  <!-- Importação da biblioteca oficial do Google <model-viewer> -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* Reset básico e estilização em paleta clara minimalista */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      max-width: 800px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #111111;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #666666;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Moldura elegante e clara do visualizador 3D */
    .viewer-container {
      width: 100%;
      max-width: 960px;
      height: 68vh;
      background-color: #fafafa;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: #fafafa;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: #888888;
    }

    /* Ajuste fino para telas móveis */
    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      .viewer-container {
        height: 60vh;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.4rem;
      }
      p.subtitle {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>MatemArte: Poéticas Algorítmicas</h1>
    <p class="subtitle">Clique e arraste para rotacionar em 360° | Use o scroll para aproximar</p>
  </header>

  <main class="viewer-container">
    <!-- Componente de Exibição 3D e Realidade Aumentada -->
    <model-viewer
      src="ModeloDiniGLB.glb"
      alt="Artefato Paramétrico 3D — MatemArte"
      auto-rotate
      camera-controls
      shadow-intensity="1"
      shadow-softness="0.8"
      exposure="1.05"
      ar
      ar-modes="webxr scene-viewer quick-look">
    </model-viewer>
  </main>

  <footer>
    <p>MatemArte V7.0 — Exibição em Realidade Aumentada (AR) disponível em dispositivos móveis compatíveis.</p>
  </footer>

</body>
</html>
